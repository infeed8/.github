name: Bug report
description: Something does not work as expected.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. 1.4.2 or a1b2c3d
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, runtime, browser, hardware, whatever is relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove credentials and customer data first.
      render: text
